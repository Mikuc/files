<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSF Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen font-sans text-sm select-none">

<!-- ── Top bar ─────────────────────────────────────────────────────────── -->
<header class="bg-white border-b border-gray-200 px-5 py-2.5 flex items-center gap-4 shrink-0 shadow-sm">
  <span class="text-gray-900 font-bold text-sm tracking-tight">JSF Analyzer</span>
  <span id="genDate" class="text-gray-400 text-xs"></span>
  <div id="statsBar" class="hidden flex items-center gap-2 text-xs">
    <span class="text-gray-600 bg-gray-100 border border-gray-200 rounded-full px-2.5 py-0.5 font-medium" id="statPages"></span>
    <span class="text-gray-600 bg-gray-100 border border-gray-200 rounded-full px-2.5 py-0.5 font-medium" id="statEps"></span>
    <span id="statWsdl" class="hidden text-gray-600 bg-gray-100 border border-gray-200 rounded-full px-2.5 py-0.5 font-medium"></span>
  </div>
  <div class="ml-auto">
    <label class="cursor-pointer text-xs text-gray-500 hover:text-gray-700 border border-gray-300 hover:border-gray-400 bg-white rounded px-3 py-1.5 transition-colors font-medium">
      Load file
      <input type="file" id="filePick" accept=".json" class="hidden" />
    </label>
  </div>
</header>

<!-- ── Empty state ──────────────────────────────────────────────────────── -->
<div id="empty" class="flex flex-col items-center justify-center mt-32 gap-3">
  <div class="text-5xl mb-2">📄</div>
  <p class="text-gray-600 text-sm font-medium">Drop <code class="text-blue-600 bg-blue-50 px-1 rounded">analysis.json</code> anywhere on the page</p>
  <p class="text-gray-400 text-xs">or</p>
  <label class="cursor-pointer text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 py-2 transition-colors font-medium shadow-sm">
    Pick file
    <input type="file" id="filePick2" accept=".json" class="hidden" />
  </label>
  <p class="text-gray-300 text-xs mt-4">
    Or place <code class="font-mono">viewer.html</code> next to <code class="font-mono">analysis.json</code> and serve via <code class="font-mono">npx serve .</code>
  </p>
</div>

<!-- ── App shell (hidden until loaded) ─────────────────────────────────── -->
<div id="app" class="hidden flex flex-col" style="height:calc(100vh - 45px)">

  <!-- Tab bar -->
  <div class="bg-white flex border-b border-gray-200 px-5 shrink-0">
    <button id="tabBtnPages" onclick="switchTab('pages')"
      class="text-sm font-semibold py-3 mr-6 border-b-2 border-blue-600 text-blue-600 transition-colors">
      Pages
    </button>
    <button id="tabBtnEndpoints" onclick="switchTab('endpoints')"
      class="text-sm font-semibold py-3 mr-6 border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition-colors">
      Endpoints
    </button>
  </div>

  <!-- Two-column layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-72 shrink-0 bg-white border-r border-gray-200 flex flex-col">
      <div class="p-3 border-b border-gray-100">
        <input id="searchBox" type="text" placeholder="Search…" oninput="renderList()"
          class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm
                 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2
                 focus:ring-blue-500 focus:border-blue-500 transition-shadow" />
      </div>
      <div id="listPanel" class="flex-1 overflow-y-auto py-2"></div>
    </aside>

    <!-- Detail panel -->
    <main id="detail" class="flex-1 overflow-y-auto p-8 bg-gray-50">
      <div class="text-gray-300 text-sm mt-16 text-center">← select an item</div>
    </main>

  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let D        = null
let tab      = 'pages'
let selected = null

// ─── Load ─────────────────────────────────────────────────────────────────────
async function tryFetch() {
  try {
    const r = await fetch('./analysis.json')
    if (r.ok) boot(await r.json())
  } catch { /* no auto-load */ }
}

function readFile(file) {
  const r = new FileReader()
  r.onload = e => { try { boot(JSON.parse(e.target.result)) } catch { alert('Invalid JSON') } }
  r.readAsText(file)
}

function boot(d) {
  D = d
  document.getElementById('empty').classList.add('hidden')
  const app = document.getElementById('app')
  app.classList.remove('hidden')
  app.classList.add('flex')

  document.getElementById('genDate').textContent =
    'Generated ' + new Date(d.generatedAt).toLocaleString()
  document.getElementById('statsBar').classList.remove('hidden')
  document.getElementById('statsBar').classList.add('flex')
  document.getElementById('statPages').textContent = d.summary.totalPages + ' pages'
  document.getElementById('statEps').textContent   = d.summary.totalEndpoints + ' endpoints'
  if (d.summary.totalWsdlTypes > 0) {
    const w = document.getElementById('statWsdl')
    w.textContent = d.summary.totalWsdlTypes + ' WSDL types'
    w.classList.remove('hidden')
  }

  switchTab('pages')
}

document.getElementById('filePick').onchange  = e => e.target.files[0] && readFile(e.target.files[0])
document.getElementById('filePick2').onchange = e => e.target.files[0] && readFile(e.target.files[0])
document.addEventListener('dragover', e => e.preventDefault())
document.addEventListener('drop', e => {
  e.preventDefault()
  const f = e.dataTransfer.files[0]
  if (f?.name.endsWith('.json')) readFile(f)
})

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(t) {
  tab = t
  selected = null
  const on  = 'text-sm font-semibold py-3 mr-6 border-b-2 border-blue-600 text-blue-600 transition-colors'
  const off = 'text-sm font-semibold py-3 mr-6 border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition-colors'
  document.getElementById('tabBtnPages').className     = t === 'pages'     ? on : off
  document.getElementById('tabBtnEndpoints').className = t === 'endpoints' ? on : off
  renderList()
  document.getElementById('detail').innerHTML =
    `<div class="text-gray-300 text-sm mt-16 text-center">← select a ${t === 'pages' ? 'page' : 'endpoint'}</div>`
}

// ─── List ─────────────────────────────────────────────────────────────────────
function renderList() {
  if (!D) return
  const q = (document.getElementById('searchBox').value || '').toLowerCase().trim()
  tab === 'pages' ? renderPageList(q) : renderEndpointList(q)
}

function renderPageList(q) {
  const pages = D.pages.filter(p => !q ||
    p.relativePath.toLowerCase().includes(q) ||
    (p.title ?? '').toLowerCase().includes(q) ||
    (p.titleKey ?? '').toLowerCase().includes(q) ||
    p.url.toLowerCase().includes(q) ||
    p.beans.some(b =>
      b.name.toLowerCase().includes(q) ||
      b.methods.some(m => m.toLowerCase().includes(q)) ||
      b.properties.some(pr => pr.toLowerCase().includes(q))
    )
  )

  const groups = {}
  for (const p of pages) {
    const mod = p.relativePath.includes('/') ? p.relativePath.split('/')[0] : '—'
    ;(groups[mod] ??= []).push(p)
  }

  const el = document.getElementById('listPanel')
  if (!pages.length) {
    el.innerHTML = '<div class="text-gray-400 text-xs px-4 py-3">No results</div>'
    return
  }

  el.innerHTML = Object.entries(groups).map(([mod, ps]) => `
    <div class="mb-1">
      <div class="text-gray-400 text-xs px-4 py-1.5 uppercase tracking-widest font-semibold">${esc(mod)}</div>
      ${ps.map(p => {
        const label  = p.title ?? p.titleKey ?? p.relativePath.split('/').pop().replace('.xhtml','')
        const active = selected === p.relativePath
        const nb     = p.beans.filter(b => !b.isInfraBean).length
        return `
          <button onclick="openPage('${esc(p.relativePath)}')"
            class="w-full text-left px-4 py-2.5 transition-colors ${active ? 'bg-blue-50 border-r-2 border-blue-500' : 'hover:bg-gray-50'}">
            <div class="truncate text-sm font-medium ${active ? 'text-blue-700' : 'text-gray-800'}">${esc(label)}</div>
            <div class="truncate text-gray-400 text-xs mt-0.5 font-mono">${esc(p.url)}</div>
            <div class="text-gray-400 text-xs mt-0.5">${nb} bean${nb !== 1 ? 's' : ''}</div>
          </button>`
      }).join('')}
    </div>
  `).join('')
}

function renderEndpointList(q) {
  const eps = Object.values(D.endpoints).filter(e => !q ||
    e.operationName.toLowerCase().includes(q) ||
    e.path.toLowerCase().includes(q) ||
    (e.summary ?? '').toLowerCase().includes(q)
  )

  const el    = document.getElementById('listPanel')
  const LIMIT = 250

  if (!eps.length) {
    el.innerHTML = '<div class="text-gray-400 text-xs px-4 py-3">No results</div>'
    return
  }

  el.innerHTML = eps.slice(0, LIMIT).map(e => {
    const usedBy = (D.endpointUsage[e.operationName] ?? []).length
    const active = selected === e.operationName
    return `
      <button onclick="openEndpoint('${esc(e.operationName)}')"
        class="w-full text-left px-4 py-2.5 transition-colors ${active ? 'bg-blue-50 border-r-2 border-blue-500' : 'hover:bg-gray-50'}">
        <div class="truncate text-sm font-medium ${active ? 'text-blue-700' : 'text-gray-800'}">${esc(e.operationName)}</div>
        <div class="truncate text-gray-400 text-xs font-mono mt-0.5">${esc(e.path)}</div>
        ${usedBy ? `<div class="text-blue-500 text-xs mt-0.5">${usedBy} page${usedBy !== 1 ? 's' : ''}</div>` : ''}
      </button>`
  }).join('')

  if (eps.length > LIMIT)
    el.innerHTML += `<div class="text-gray-400 text-xs px-4 py-3">+${eps.length - LIMIT} more — narrow search</div>`
}

// ─── Page detail ──────────────────────────────────────────────────────────────
function openPage(relPath) {
  selected = relPath
  renderList()

  const page = D.pages.find(p => p.relativePath === relPath)
  if (!page) return

  const mainBeans  = page.beans.filter(b => !b.isInfraBean)
  const infraBeans = page.beans.filter(b =>  b.isInfraBean)

  document.getElementById('detail').innerHTML = `
    <div class="max-w-2xl mx-auto">

      <!-- header -->
      <div class="mb-7">
        <div class="flex flex-wrap items-start gap-2 mb-2">
          <h2 class="text-gray-900 font-bold text-xl leading-snug">
            ${esc(page.title ?? page.relativePath.split('/').pop().replace('.xhtml',''))}
          </h2>
          ${page.titleKey ? `<span class="text-xs text-gray-500 bg-gray-100 border border-gray-200 rounded px-2 py-0.5 mt-1 font-mono">${esc(page.titleKey)}</span>` : ''}
        </div>
        <div class="flex items-center gap-2">
          <span class="text-blue-600 font-mono text-sm">${esc(page.url)}</span>
          <span class="text-xs text-gray-400 bg-gray-100 rounded px-1.5 py-0.5">${page.urlSource}</span>
        </div>
        <div class="text-gray-400 text-xs mt-1.5 font-mono truncate">${esc(page.filePath)}</div>
      </div>

      <!-- main beans -->
      ${mainBeans.length === 0
        ? '<p class="text-gray-400 text-sm">No feature beans detected.</p>'
        : mainBeans.map(beanCard).join('')}

      <!-- infra beans -->
      ${infraBeans.length ? `
        <details class="mt-2 group">
          <summary class="text-gray-400 text-xs cursor-pointer hover:text-gray-600 list-none flex items-center gap-1.5 select-none py-1">
            <span class="transition-transform group-open:rotate-90 inline-block text-gray-300">▶</span>
            Infrastructure beans (${infraBeans.length})
          </summary>
          <div class="mt-2 pl-4 border-l-2 border-gray-100 space-y-1.5">
            ${infraBeans.map(b => `
              <div class="text-xs flex gap-2 items-baseline">
                <span class="text-gray-500 font-medium font-mono">${esc(b.name)}</span>
                <span class="text-gray-400">${[...b.methods, ...b.properties].join(', ')}</span>
              </div>`).join('')}
          </div>
        </details>
      ` : ''}

    </div>`
}

function beanCard(b) {
  const eps = b.matchedEndpoints
  return `
    <div class="bg-white border border-gray-200 rounded-xl p-5 mb-4 shadow-sm">

      <div class="text-gray-900 font-bold text-base mb-4 font-mono">${esc(b.name)}</div>

      ${b.methods.length ? `
        <div class="mb-3">
          <span class="text-gray-400 text-xs uppercase tracking-wide font-semibold mr-2">Methods</span>
          <div class="mt-1.5 flex flex-wrap gap-1">
            ${b.methods.map(m =>
              `<span class="px-2.5 py-0.5 rounded-full bg-violet-100 text-violet-700 text-xs font-medium border border-violet-200">${esc(m)}</span>`
            ).join('')}
          </div>
        </div>` : ''}

      ${b.properties.length ? `
        <div class="mb-4">
          <span class="text-gray-400 text-xs uppercase tracking-wide font-semibold mr-2">Properties</span>
          <div class="mt-1.5 flex flex-wrap gap-1">
            ${b.properties.map(p =>
              `<span class="px-2 py-0.5 rounded bg-gray-100 text-gray-600 text-xs font-mono border border-gray-200">${esc(p)}</span>`
            ).join('')}
          </div>
        </div>` : ''}

      ${eps.length ? `
        <details open>
          <summary class="text-gray-500 text-xs cursor-pointer hover:text-gray-700 select-none mb-2 list-none flex items-center gap-1.5 font-semibold uppercase tracking-wide">
            <span class="details-arrow transition-transform text-gray-300">▶</span>
            Matched endpoints (${eps.length})
          </summary>
          <div class="border-l-2 border-gray-100 pl-3 space-y-0.5 mt-2">
            ${eps.map(ep => `
              <button onclick="openEndpointFromPage('${esc(ep.operationName)}')"
                class="w-full text-left flex items-center gap-2.5 px-2.5 py-2 rounded-lg hover:bg-gray-50 group/ep transition-colors">
                <span class="text-xs font-bold w-5 text-center shrink-0 ${scoreColor(ep.matchScore)} tabular-nums">${ep.matchScore}</span>
                <span class="text-blue-600 text-sm font-medium group-hover/ep:text-blue-800 truncate">${esc(ep.operationName)}</span>
                <span class="text-gray-400 text-xs font-mono truncate">${esc(ep.path)}</span>
              </button>`).join('')}
          </div>
        </details>
      ` : `<div class="text-gray-400 text-xs">No endpoint matches</div>`}

    </div>`
}

// ─── Endpoint detail ──────────────────────────────────────────────────────────
function openEndpointFromPage(opName) {
  switchTab('endpoints')
  openEndpoint(opName)
}

function openEndpoint(opName) {
  selected = opName
  renderList()

  const ep = D.endpoints[opName]
  if (!ep) return

  const usedBy = D.endpointUsage[opName] ?? []

  document.getElementById('detail').innerHTML = `
    <div class="max-w-2xl mx-auto">

      <!-- header -->
      <div class="mb-7">
        <h2 class="text-gray-900 font-bold text-xl mb-3 font-mono">${esc(ep.operationName)}</h2>
        <div class="flex items-center gap-2">
          <span class="text-xs px-2.5 py-1 rounded-full bg-blue-100 text-blue-700 font-bold uppercase border border-blue-200">${ep.method}</span>
          <span class="text-gray-600 font-mono text-sm">${esc(ep.path)}</span>
        </div>
        ${ep.tags.length ? `<div class="text-gray-400 text-xs mt-2">${ep.tags.join(' · ')}</div>` : ''}
      </div>

      <!-- used by -->
      <div class="mb-7">
        <div class="text-gray-500 text-xs uppercase tracking-wide font-semibold mb-2">Used by pages</div>
        ${usedBy.length
          ? `<div class="flex flex-wrap gap-1.5">
              ${usedBy.map(p => `
                <button onclick="openPageFromEndpoint('${esc(p)}')"
                  class="text-xs px-3 py-1 rounded-full bg-gray-100 text-gray-600 hover:bg-blue-50 hover:text-blue-700 border border-gray-200 hover:border-blue-200 transition-colors font-medium">
                  ${esc(p)}
                </button>`).join('')}
             </div>`
          : '<div class="text-gray-400 text-sm">Not referenced by any detected page</div>'}
      </div>

      <!-- request / response fields -->
      ${fieldsSection('Request', ep.requestSchemaName, ep.requestFields)}
      ${fieldsSection('Response', ep.responseSchemaName, ep.responseFields)}

    </div>`
}

function openPageFromEndpoint(relPath) {
  switchTab('pages')
  openPage(relPath)
}

function fieldsSection(label, schemaName, fd) {
  const header = `
    <div class="flex items-center gap-2 mb-3">
      <span class="text-gray-700 text-xs uppercase tracking-wide font-bold">${label}</span>
      ${schemaName ? `<span class="text-gray-400 font-mono text-xs">${esc(schemaName)}</span>` : ''}
      ${fd ? `<span class="text-xs text-gray-400 bg-gray-100 rounded px-1.5 py-0.5">${fd.source}</span>` : ''}
    </div>`

  if (!fd)
    return `<div class="mb-6">${header}<p class="text-gray-400 text-sm">No schema data available</p></div>`

  const { fields } = fd
  if (!fields.length)
    return `<div class="mb-6">${header}<p class="text-gray-400 text-sm">No fields</p></div>`

  return `
    <div class="mb-7">
      ${header}
      <div class="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200">
              <th class="text-left px-4 py-2.5 text-gray-500 font-semibold text-xs uppercase tracking-wide">Field</th>
              <th class="text-left px-4 py-2.5 text-gray-500 font-semibold text-xs uppercase tracking-wide">Type</th>
              <th class="text-left px-4 py-2.5 text-gray-500 font-semibold text-xs uppercase tracking-wide">Req</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            ${fields.map(f => `
              <tr class="hover:bg-blue-50/40 transition-colors">
                <td class="px-4 py-2.5 text-gray-800 font-mono text-sm">${esc(f.name)}</td>
                <td class="px-4 py-2.5 text-blue-600 font-mono text-sm">${esc(String(f.type ?? 'any'))}</td>
                <td class="px-4 py-2.5 text-sm">${f.required
                  ? '<span class="text-amber-600 font-bold">●</span>'
                  : '<span class="text-gray-300">—</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function scoreColor(s) {
  return s >= 5 ? 'text-emerald-600' : s >= 3 ? 'text-amber-500' : 'text-gray-400'
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
tryFetch()
</script>

<style>
  details[open] > summary .details-arrow { transform: rotate(90deg); }
</style>
</body>
</html>
